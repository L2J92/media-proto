spring:
  application:
    name: live-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/live;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 무료 DB(Neon) 연결 수 제한에 맞춰 작게 유지
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리한다. 엔티티와 다르면 기동을 막는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    # 이미 테이블이 있는 운영 DB는 V1을 기준점으로 기록하고 그 다음 버전부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
  session:
    jdbc:
      # 세션 테이블도 Flyway(V1)가 만든다
      initialize-schema: never
    timeout: 7d

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

broadcast:
  # 송출자 연결이 끊긴 뒤 자동 종료까지 기다리는 시간
  publisher-grace-period: ${PUBLISHER_GRACE_PERIOD:45s}
  presence-check-interval: 15s

recording:
  enabled: ${RECORDING_ENABLED:false}
  s3:
    access-key: ${S3_ACCESS_KEY:}
    secret: ${S3_SECRET:}
    region: ${S3_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}

toss:
  # 토스페이먼츠 테스트 키 (개발자센터 → API 키). 결제창(payment)용 test_ck_ / test_sk_
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}
  api-url: https://api.tosspayments.com

app:
  demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health

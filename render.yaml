# Render Blueprint: 저장소를 연결하면 이 설정으로 웹 서비스를 만든다.
services:
  - type: web
    name: media-proto
    runtime: docker
    plan: free
    # Neon DB(AWS ap-southeast-1)와 같은 지역. 한국에서도 가장 가깝다.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL            # 예: jdbc:postgresql://<host>/<db>?sslmode=require (Neon)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ACCOUNTS_ENABLED
        value: "true"
      # 녹화: Cloudflare R2 등 S3 호환 저장소 (README 참고)
      - key: RECORDING_ENABLED
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_REGION
        value: auto

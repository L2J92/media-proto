# Render Blueprint: 저장소를 연결하면 이 설정으로 웹 서비스를 만든다.
services:
  - type: web
    name: live-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL            # 예: jdbc:postgresql://<host>/<db>?sslmode=require (Neon)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ACCOUNTS_ENABLED
        value: "true"
      - key: RECORDING_ENABLED
        value: "false"
